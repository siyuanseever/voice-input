<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <!-- 小红书竖版（3:4）框架图：6 步 + Claude Code 记词表的闭环。改完运行 docs/promo/img/render.py 重新生成 PNG。 -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B8B8BE"/>
    </marker>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>
  <style>
    text { font-family: "PingFang SC", -apple-system, sans-serif; fill: #1D1D1F; }
    .title { font-size: 56px; font-weight: 700; }
    .sub { font-size: 30px; fill: #6E6E73; }
    .h { font-size: 36px; font-weight: 600; }
    .t { font-size: 28px; fill: #3A3A3C; }
    .warn { font-size: 28px; fill: #C2410C; }
    .num { font-size: 26px; font-weight: 700; fill: #fff; }
    .foot { font-size: 26px; fill: #6E6E73; }
    .s { font-size: 24px; fill: #9A5B43; }
    .box { fill: #FFFFFF; stroke: #DEDEE3; stroke-width: 2; }
  </style>

  <rect width="1080" height="1440" fill="#FAFAF7"/>
  <text x="60" y="104" class="title">我的语音输入是怎么工作的</text>
  <text x="60" y="152" class="sub">6 步出字，听错的词 Claude 会帮我记下来</text>
  <rect x="60" y="190" width="930" height="136" rx="24" class="box"/>
  <circle cx="112" cy="238" r="24" fill="#D97757"/><text x="112" y="247" text-anchor="middle" class="num">1</text>
  <text x="156" y="250" class="h">说话</text>
  <text x="156" y="296" class="t">按住右 Command 说，松开结束；鼠标侧键也行</text>
  <path d="M525,328 L525,352" stroke="#B8B8BE" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="60" y="356" width="930" height="136" rx="24" class="box"/>
  <circle cx="112" cy="404" r="24" fill="#D97757"/><text x="112" y="413" text-anchor="middle" class="num">2</text>
  <text x="156" y="416" class="h">录音</text>
  <text x="156" y="462" class="t">底部小浮窗显示时长和音量；每段先存盘，失败能重来</text>
  <path d="M525,494 L525,518" stroke="#B8B8BE" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="60" y="522" width="930" height="136" rx="24" class="box"/>
  <circle cx="112" cy="570" r="24" fill="#D97757"/><text x="112" y="579" text-anchor="middle" class="num">3</text>
  <text x="156" y="582" class="h">听写</text>
  <text x="156" y="628" class="t">阿里云 → Gemini → 本机模型，按顺序试，挂了自动换</text>
  <path d="M525,660 L525,684" stroke="#B8B8BE" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="60" y="688" width="930" height="136" rx="24" class="box"/>
  <circle cx="112" cy="736" r="24" fill="#D97757"/><text x="112" y="745" text-anchor="middle" class="num">4</text>
  <text x="156" y="748" class="h">校对</text>
  <text x="156" y="794" class="warn">只许删"嗯啊"、改标点、改英文写法，不改原话</text>
  <path d="M525,826 L525,850" stroke="#B8B8BE" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="60" y="854" width="930" height="136" rx="24" class="box"/>
  <circle cx="112" cy="902" r="24" fill="#D97757"/><text x="112" y="911" text-anchor="middle" class="num">5</text>
  <text x="156" y="914" class="h">兜底</text>
  <text x="156" y="960" class="t">按常用词表替换：Cloud Code → Claude Code</text>
  <path d="M525,992 L525,1016" stroke="#B8B8BE" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="60" y="1020" width="930" height="136" rx="24" class="box"/>
  <circle cx="112" cy="1068" r="24" fill="#D97757"/><text x="112" y="1077" text-anchor="middle" class="num">6</text>
  <text x="156" y="1080" class="h">出字</text>
  <text x="156" y="1126" class="t">直接出现在光标处，同时放进剪贴板</text>

  <!-- 闭环：文字进了 Claude Code → 它把听错的词记进词表 → 下次 ③④⑤ 就用上 -->
  <path d="M525,1158 L525,1192" stroke="#D97757" stroke-width="3" marker-end="url(#arr3)"/>
  <rect x="60" y="1196" width="930" height="150" rx="24" fill="#FDF1EC" stroke="#D97757" stroke-width="2.5"/>
  <text x="96" y="1252" class="h">Claude Code 帮我记词表</text>
  <text x="96" y="1296" class="t">看出哪个词听错了，就把"错误 => 正确"写进去</text>
  <text x="96" y="1332" class="s">我的词表一个月改了 108 次，86 次是它改的</text>
  <path d="M990,1271 L1040,1271 L1040,590 L996,590" stroke="#D97757" stroke-width="3" fill="none" marker-end="url(#arr3)"/>
  <text x="1015" y="893" class="s" text-anchor="middle" style="writing-mode: vertical-rl; font-size: 24px">下次就听对</text>

  <text x="60" y="1408" class="foot">开源 · 只支持 Mac · GitHub 搜 siyuanseever/voice-input</text>
</svg>
